resources:
  jobs:
    daily_bronze_silver_gold_customers:
      name: daily_bronze_silver_gold_customers_${bundle.target}

      tasks:
        # BRONZE
        - task_key: bronze_load
          dbt_task:
            project_directory: lakehouse_databricks
            commands:
              - dbt deps
              - dbt seed --select customers
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}
            source: GIT
          environment_key: dbt-default

        # SILVER
        - task_key: load_silver_customers
          depends_on:
            - task_key: bronze_load

          dbt_task:
            project_directory: lakehouse_databricks
            commands:
              - dbt deps
              - dbt run --select customers_ids
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}
            source: GIT
          environment_key: dbt-default

        # GOLD
        - task_key: load_gold_customers
          depends_on:
            - task_key: load_silver_customers

          dbt_task:
            project_directory: lakehouse_databricks
            commands:
              - dbt deps
              - dbt run --select customers_info
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}
            source: GIT
          environment_key: dbt-default

      git_source:
        git_url: https://github.com/fadhi56/lakehouse
        git_provider: gitHub
        git_branch: ${var.git_branch}

      queue:
        enabled: true

      environments:
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.1,<2.0.0
            environment_version: "6"

      performance_target: PERFORMANCE_OPTIMIZED