bundle:
  name: lakehouse_databricks

sync:
  exclude:
    - pipeline_tests/**

include:
  - jobs/**/*.yml
  - jobs/*.yml
  - pipelines/*.yml

variables:
  catalog:
    description: Unity Catalog name

  schema:
    description: Default schema for dbt models

  pipeline_schema:
    description: Default schema for Lakeflow pipelines

  warehouse_id:
    description: SQL warehouse ID

  git_branch:
    description: Git branch for dbt execution

targets:
  dev:
    mode: production
    default: true

    workspace:
      root_path: /Workspace/Users/ssellmy4@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: dev
      schema: dbt
      pipeline_schema: lakeflow
      warehouse_id: 3b4dceb1004c6724
      git_branch: test

  prod:
    mode: production

    workspace:
      root_path: /Workspace/Users/ssellmy4@gmail.com/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: prod
      schema: dbt
      pipeline_schema: lakeflow
      warehouse_id: 3b4dceb1004c6724
      git_branch: main