bundle:
  name: lakehouse_databricks

include:
  - jobs/**/*.yml

variables:
  catalog:
    description: Unity Catalog name

  schema:
    description: Default schema for dbt models

  warehouse_id:
    description: SQL warehouse ID

  git_branch:
    description: Git branch for dbt execution

targets:
  dev:
    mode: development
    default: true

    variables:
      catalog: dev
      schema: dbt
      warehouse_id: 3b4dceb1004c6724
      git_branch: test

  prod:
    mode: production

    variables:
      catalog: prod
      schema: dbt
      warehouse_id: 3b4dceb1004c6724
      git_branch: main