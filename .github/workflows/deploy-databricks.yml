name: Deploy Databricks Asset Bundle

on:
  push:
    branches:
      - test
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-deployment-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Databricks Bundle
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat

    defaults:
      run:
        working-directory: lakehouse_databricks

    steps:

      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Databricks CLI
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # Step 3: Determine deployment target
      - name: Set Deployment Target
        id: target
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            test)
              TARGET=dev
              ;;
            main)
              TARGET=prod
              ;;
            *)
              echo "Unsupported branch: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

          echo "GitHub branch: $GITHUB_REF_NAME"
          echo "Databricks target: $TARGET"
          echo "Job suffix: _$TARGET"

      # Step 4: Check environment variables
      - name: Verify Environment Variables
        shell: bash
        run: |
          test -n "$DATABRICKS_HOST" || {
            echo "DATABRICKS_HOST missing"
            exit 1
          }

          test -n "$DATABRICKS_TOKEN" || {
            echo "DATABRICKS_TOKEN missing"
            exit 1
          }

      # Step 5: Verify authentication
      - name: Check Databricks Authentication
        run: databricks current-user me

      # Step 6: Validate bundle
      - name: Validate Databricks Bundle
        run: databricks bundle validate -t "$TARGET"

      # Step 7: Deploy bundle
      - name: Deploy Databricks Bundle
        run: databricks bundle deploy -t "$TARGET"

      # Step 8: Show deployed resources
      - name: Show Deployed Resources
        run: databricks bundle summary -t "$TARGET"

      # Step 9: Deployment summary
      - name: Deployment Summary
        run: |
          echo "## Databricks Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| GitHub Branch | $GITHUB_REF_NAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bundle Target | $TARGET |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job Suffix | _$TARGET |" >> "$GITHUB_STEP_SUMMARY"